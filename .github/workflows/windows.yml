name: Windows executable
on:
  push:
    paths:
      - 'gpo_macro/**'
      - 'tests/**'
      - 'run.py'
      - 'requirements*.txt'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name GPO-Fishing-Macro --collect-all mss --hidden-import keyboard --hidden-import numpy --hidden-import win32api --hidden-import win32con --hidden-import win32gui --collect-all pynput --icon gpo_macro/assets/app.ico --add-data "gpo_macro/assets;gpo_macro/assets" run.py
      - name: Verify packaged application opens and closes
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/GPO-Fishing-Macro.exe" -PassThru
          try {
            $window = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) { throw "Application exited during startup." }
              # One-file PyInstaller uses a parent bootloader and a GUI child.
              $window = Get-Process -Name 'GPO-Fishing-Macro' -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -like 'GPO Fishing*' } |
                Select-Object -First 1
              if ($window) { break }
            }
            if (-not $window) { throw "Expected main application window was not found." }
            $null = $window.CloseMainWindow()
            if (-not $app.WaitForExit(15000)) { throw "Application did not close." }
            if ($app.ExitCode -ne 0) { throw "Nonzero application exit code: $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { $app.Kill($true) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GPO-Fishing-Macro-Windows
          path: dist/GPO-Fishing-Macro.exe
          if-no-files-found: error
